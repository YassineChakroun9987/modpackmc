	#If true, each light's own powers work on the power key (see each light's section). If false, none of them do.
	enabled = true
	#If true, each light's passive effect works the whole time it's lit. The closer to death a red bearer is, the
	#harder they hit. A blue one heals slowly. A green one's constructs cost less. And so on. If false, none of them do.
