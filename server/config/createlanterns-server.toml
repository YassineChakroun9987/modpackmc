#How the lights affect each other. Two rings worn together, and the lit rings of bearers near each other,
#strengthen or weaken each other's light (hope feeds will, hope calms rage, opposites dim each other, death and life
#most of all). A weakened ring's abilities, grip and constructs get weaker, and its charge drains faster.
#A strengthened one's the other way round.
[potency]
	#If true, two rings worn together affect each other. Blue and green strengthen each
	#other, and opposites clash and both get weaker. If false, they don't.
	wornTogether = true
	#How strongly two rings worn together affect each other,
	#compared to the default (1 makes blue and green each a quarter stronger, opposites each a quarter weaker, black and white
	#each by half).
	# Default: 1.0
	# Range: 0.0 ~ 4.0
	wornTogetherStrength = 1.0
	#If true, the lit rings of bearers near each other affect each other. A blue ring nearby weakens
	#a red or yellow one and strengthens a green one. Opposites weaken each other, black and white the most.
	#If false, they don't.
	nearby = true
	#How strongly another bearer's lit ring nearby affects a bearer's,
	#compared to the default (1 is as much as worn together, while they're within a quarter of the radius).
	# Default: 1.0
	# Range: 0.0 ~ 4.0
	nearbyStrength = 1.0
	#How close (blocks) another bearer's lit ring has to be to affect a bearer's. It's full strength within a
	#quarter of that, then it fades out to nothing at the edge.
	# Default: 16.0
	# Range: 0.0 ~ 128.0
	radius = 16.0

#What a ring can do to other players. Each switch only applies where the server lets players hurt each other at all (its pvp setting, and teams).
[pvp]
	#If true, the lights' powers can hurt and hinder other players: a plasma bolt, drain, fear
	#shaking their hard light. If false, powers don't affect players.
	powers = true
	#If true, a ring can grab another player, and what it holds or throws can hurt them. If false,
	#it can't do either (and drops any player it's holding now).
	grip = true
	#If true, a bearer's constructs can hurt other players by running into them and burning them in
	#their fires. If false, someone else's hard light never hurts a player.
	constructs = true
	#If true, a crash's blast hurts other players nearby, and a hero landing throws them back. If
	#false, neither one affects other players.
	flight = true

#What the mod can do to the world's blocks.
[griefing]
	#If true, the mod changes the world's blocks where its story needs to. That's crash craters and
	#(in an edition with them) the wrecks of ships that come down. If false, it doesn't change anything. No crater gets dug and no
	#ship comes down.
	worldChanges = true
	#If true, the mod only changes the world's blocks (craters, wrecks) while the game rule
	#mobGriefing is on. If false, it ignores the rule, same as it always has.
	followMobGriefing = false

#Dimensions where rings, flight and constructs don't work. Each entry's an id
#(minecraft:the_nether), or every dimension of a mod (twilightforest:*).
[dimensions]
	#Dimensions where rings can't light up. A lit one goes dark there (so nothing else about it works there either).
	noRings = []
	#Dimensions where rings can't fly. Anyone flying there drops.
	noFlight = []
	#Dimensions where constructs can't be designed, copied or summoned. Any that are out there disappear.
	noConstructs = []

#The land ahead of a fast flier, flying on the ring or riding a construct. It gets made and loaded before they
#reach it, so it's there when they arrive.
[landAhead]
	#If true, the land in the path of a bearer flying fast, or riding a construct fast, gets made and loaded
	#before they reach it, as far ahead as seconds says, nearest first (with Distant Horizons on the server, its far terrain gets
	#built ahead of them first). If false, the land loads like it does for anyone, around them as they go, a
	#few chunks at a time.
	enabled = true
	#How far ahead the land gets made, in seconds of flight at the fastest they went over the last that many
	#seconds (so someone held back at the edge of the land still gets land made as fast as they flew). At 300 blocks a
	#second, 4 is 1200 blocks ahead. At 18 (a construct ridden flat out, by default) it's 72.
	# Default: 4.0
	# Range: 0.5 ~ 30.0
	seconds = 4.0
	#The most chunks requested ahead in one server tick, for all fliers together.
	# Default: 8
	# Range: 1 ~ 256
	chunksPerTick = 8
	#The most chunks kept loaded along one flier's path at once (each with the
	#chunks around it fully made). At 1000 blocks a second, 128 is about two seconds of flight.
	# Default: 128
	# Range: 1 ~ 4096
	chunksPerFlier = 128
	#The most chunks kept loaded along the paths of all fliers together.
	# Default: 512
	# Range: 1 ~ 65536
	mostChunks = 512

#A light's dust. Cooking a bucket of its liquid light in a furnace or a smoker makes it (Willpower Dust, Fear Dust
#and so on). Taking it heightens that light for a while.
[dust]
	#If true, the dust is snorted instead of eaten. It's held up to the face and sniffed, with no crunching.
	#It does the same either way.
	snortIt = false
	#How many seconds a dust's light stays heightened (180 is 3 minutes).
	# Default: 180
	# Range: 1 ~ 3600
	seconds = 180
	#How many times as much its light's deed points count while it's heightened (2 is twice). Willpower
	#grows that much faster too, while a ring of that light is worn.
	# Default: 2.0
	# Range: 1.0 ~ 10.0
	times = 2.0

#With Create Cosmonautics installed. What a lit ring does for its bearer in space. A world without Create
#Cosmonautics won't have this section.
[cosmonautics]
	#If true, a lit ring keeps its bearer breathing wherever Create Cosmonautics says there's no air
	#(high above the overworld, on the Moon, in deep space), like its space helmet does (underwater, ring.waterBreathing
	#decides). If false, a bearer needs a helmet and a backtank up there like anyone else.
	lifeSupport = true
	#Energy the ring burns each second keeping its bearer breathing there. A stronger bearer pays less.
	# Default: 0.2
	# Range: 0.0 ~ 1000.0
	lifeSupportPerSecond = 0.2
	#If true, the ring flies its bearer out of the world the way Create Cosmonautics takes a rocket. Past
	#the height where rockets go into deep space (20000 above the overworld, the Moon and every Lantern world), they go into a
	#space of their own. The ring flies that through Create Cosmonautics' universe as they fly (faster the further they are
	#from anything), and they come down on whatever world they fly at, like a ship does. If false, they keep flying up the
	#world's own sky however high they go and never leave it. In deep space (if they got there on a ship) they only fly around the
	#space they're in.
	spaceFlight = true
