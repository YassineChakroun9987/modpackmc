[ring]
	#How much energy a full ring holds. The UI shows it as a percentage.
	# Default: 1000.0
	# Range: 10.0 ~ 1000000.0
	capacity = 1000.0
	#Energy it costs every time the ring's activated. A stronger bearer pays less.
	# Default: 5.0
	# Range: 0.0 ~ 1000000.0
	activationCost = 5.0
	#Energy an active ring burns each second just to stay on.
	# Default: 0.2
	# Range: 0.0 ~ 1000000.0
	activeDrainPerSecond = 0.2
	#The fraction of capacity an inactive ring slowly gets back from its bearer's emotion alone (willpower, fear, rage and so on).
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	willReserve = 0.15
	#The fraction of capacity it gets back each second while it's below that reserve.
	# Default: 0.001
	# Range: 0.0 ~ 1.0
	willTricklePerSecond = 0.001
	#The fraction of the worn ring's charge that's lost when its bearer dies.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	deathChargeLoss = 0.25
	#If true, a bonded ring refuses anyone who isn't its bearer.
	enforceBond = true
	#How strong (0-100) a new bearer's emotion starts out. Willpower for a green ring, fear for a yellow one, and so on.
	# Default: 25.0
	# Range: 0.0 ~ 100.0
	startingWillpower = 25.0
	#How many seconds a ring needs to be lit before its constructs can hold one more block. It's half that
	#while the bearer has hard light out. 0 turns growth off.
	# Default: 60.0
	# Range: 0.0 ~ 86400.0
	blockGrowthSeconds = 60.0
	#The most blocks time can add to a construct's limit, on top of what willpower gives.
	# Default: 1000
	# Range: 0 ~ 4096
	blockGrowthMax = 1000
	#If true, a bearer can wear a second ring on their other hand (the ring slot above the first). The two
	#rings share their charge, both lights work while lit, and the power key uses the power of whichever one's
	#selected. If false, the other hand can't take a ring, and one worn there comes off.
	twoRings = true
	#The most rings a bearer can wear at once, one per hand (two's the limit for now.
	#1 is the same as twoRings off).
	# Default: 2
	# Range: 1 ~ 2
	mostRings = 2
	#If true, a lit ring keeps its bearer breathing underwater, whether they're flying, riding or walking the
	#bottom (their air never runs out while it's lit, suit or no suit). If false, they hold their breath like anyone else.
	waterBreathing = true
	#Energy the ring burns each second keeping its bearer breathing underwater. A stronger bearer pays
	#less.
	# Default: 0.2
	# Range: 0.0 ~ 1000.0
	waterBreathingPerSecond = 0.2
	#If true, a bound ring left lying in the world (tossed, dropped on death, spilled from a broken chest,
	#thrown out by a dispenser) lifts off and flies back to its bearer. If they're away it waits for them. Nobody
	#else can pick it up. If false, it lies there like any other item.
	returnsToBearer = true
	#If true, an unbound ring left lying in the world lifts off and goes looking for the most worthy player
	#for its light, and offers itself to them. If nobody's worthy it waits where it is and looks again every
	#minute. If false, it lies there like any other item.
	seeksNewBearer = false

[battery]
	#How much energy a lantern stores. A lantern only refills at a Central Power Battery (see centralBattery).
	# Default: 10000.0
	# Range: 100.0 ~ 1.0E7
	capacity = 10000.0
	#How many ticks a charging ritual takes to fill an empty ring, not counting the link phase.
	# Default: 70
	# Range: 1 ~ 12000
	fullChargeTicks = 70
	#How many blocks a bearer can move from the battery before the link breaks.
	# Default: 6.0
	# Range: 2.0 ~ 32.0
	linkRange = 6.0

[calling]
	#If true, rings choose their bearers. The emotional spectrum watches what every player does.
	#A light's ring comes to whoever shows its emotion strongly enough. Put an unbound ring on in survival
	#without that and it rejects you and flies off your hand. In creative any ring goes on and works until
	#it comes off. If false, any ring goes on any hand and none comes looking.
	ringsChoose = false
	#If true, a red ring never comes off once it's on. It's taken the place of the bearer's heart.
	redRingStays = true
	#How many deed points of a light's emotion a player needs before it notices them (a whisper). Deed points
	#are how strongly the emotion shows in what they do. It was 40 before rings asked for more.
	# Default: 60.0
	# Range: 0.0 ~ 100000.0
	whisperAt = 60.0
	#How many they need before they dream of it when they sleep through a night. It was 120 before rings asked for more.
	# Default: 180.0
	# Range: 0.0 ~ 100000.0
	dreamAt = 180.0
	#How many they need before an unbound ring of that light (or one passed on to them) accepts them.
	#It's also where its own moment can bring its ring. It was 150 before rings asked for more.
	# Default: 225.0
	# Range: 0.0 ~ 100000.0
	worthyAt = 225.0
	#How many they need before that light's ring comes looking for them. It was 300 before rings asked for more.
	# Default: 450.0
	# Range: 0.0 ~ 100000.0
	ringAt = 450.0
	#In-game days between each step of a light's story with a player. Whisper to dream, then dream to ring.
	#Someone who never dreams waits three times as long from the whisper.
	# Default: 7
	# Range: 0 ~ 1000
	storyDays = 7
	#In-game days before a light whose ring got turned away tries again. Each refusal raises the bar
	#by half too.
	# Default: 7
	# Range: 0 ~ 1000
	turnedAwayDays = 7
	#The chance a light's own moment brings its ring, once the player's shown enough of its emotion.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	momentChance = 0.01
	#How much a light's bar (ringAt) goes up each time its ring gets turned away. 0.5 adds half again for
	#each refusal. 0 never raises it.
	# Default: 0.5
	# Range: 0.0 ~ 100.0
	refusalRaise = 0.5
	#How many times more deed points a player needs for each ring of a light they have already had. 4 means a
	#second ring of the same light needs four times as much at every step (whisperAt, dreamAt, worthyAt and ringAt),
	#and a third needs sixteen times as much. 1 makes every ring cost the same.
	# Default: 4.0
	# Range: 1.0 ~ 100.0
	anotherRingTimes = 4.0
	#How many seconds a ring that came for someone (or was passed to them) waits for an answer before it leaves.
	# Default: 60
	# Range: 5 ~ 3600
	offerSeconds = 60
	#If true, each player's deed points slowly decay over time. Deed points are how much of each light's emotion the
	#spectrum has seen in what they do (/createlanterns spectrum shows them). Every light's points drop 3% each in-game day,
	#so what they do now counts for more than what they did ages ago. If false, only deeds change them.
	#Either way, doing the same deed over and over still counts for less while it's fresh (the spectrum gets sick of
	#it, and that's separate from decay). A light's gain still costs its opposite a quarter as much, and a bearer's
	#willpower (which only grows) never decays.
	emotionDecay = false
	#How much each deed is worth compared to what the mod first gave it. 0.5 is half, so every light needs twice
	#the deeds it used to before it stirs (and the bars from whisperAt to ringAt are higher too). 1 counts
	#deeds the way they were counted before they were lowered.
	# Default: 0.5
	# Range: 0.0 ~ 10.0
	deedWorth = 0.0
	#Deeds worth what you set here instead of the mod's value, as deed=points (plunder=0 makes a dungeon
	#chest count for nothing). deedWorth still scales them. Every deed, its id and its worth are listed in the mod's
	#docs/ARCHITECTURE.md (the calling's deeds). Set each deed added with them to 0, and deedWorth to 1, and deeds
	#count the way they used to.
	deedWorths = []
	#If true, a red ring that never comes off (redRingStays) can be taken off while its bearer's also wearing a blue ring.
	#Only the blue light can restore a Red Lantern's heart. If false, only an operator can free it.
	blueFreesRed = true

[flight]
	#If true, a bearer crashing at speed digs a crater and wrecks whatever it hits. It's a small dent at
	#20 blocks a second and a village wide at 1000. If false, crashes are still shielded and still hurt but don't break anything.
	craters = true
	#The most blocks a crater clears in one server tick. A big one gets dug out over a few seconds.
	# Default: 16000
	# Range: 500 ~ 500000
	craterBlocksPerTick = 16000
	#If true, a bearer landing hard throws back any living thing near them. It
	#doesn't hurt or break anything. If false, the landing's just seen and heard.
	landingShockwave = true
	#If true, a lit ring lets its bearer fly (double jump to take off). If false, nobody flies, and
	#anyone who's flying now drops.
	enabled = true
	#The fastest the ring flies anyone, in blocks a second (1000 max). No gear goes faster, and if gearStep
	#carries the gears up to it, it's the last gear. On a server, players already in the world get a change to this when they next join.
	# Default: 1000
	# Range: 5 ~ 1000
	topSpeed = 1000
	#The speed of a flier's first gears, in blocks a second (each from 5 to 1000), slowest first. Every flight
	#starts in first gear. Double tap forward to shift up one, tap back to shift down one. Past the last one listed
	#they keep going up by gearStep until topSpeed. A gear listed faster than topSpeed flies at topSpeed. On a server, players already in the world get a change to this when they next join.
	gears = [25, 50, 75, 100, 150, 200, 300]
	#How much faster each gear past the listed gears is than the one before, in blocks a second, up to topSpeed
	#(by default: 25, 50, 75, 100, 150, 200, 300, then up by a hundred to 1000). 0 means no gears past the listed ones.
	#You never get more than 64 gears. On a server, players already in the world get a change to this when they next join.
	# Default: 100
	# Range: 0 ~ 1000
	gearStep = 100
	#How fast flying forward builds speed, compared to the default (1). On a server, players already in the world get a change to this when they next join.
	# Default: 1.0
	# Range: 0.1 ~ 10.0
	acceleration = 1.0
	#Energy each second of flight costs. A stronger bearer pays less.
	# Default: 0.6
	# Range: 0.0 ~ 1000.0
	energyPerSecond = 0.6
	#If true, a flier can barrel-roll to either side. On a server, players already in the world get a change to this when they next join.
	barrelRolls = true
	#If true, a flier breaking the speed of sound gets wrapped in vapour, sends out shock waves and booms.
	#(Each player's game draws it with the copy of this config the server sent when they joined.)
	sonicBoom = true
	#The speed of sound, in blocks a second. Fly faster than this and you boom.
	#On a server, players already in the world get a change to this when they next join.
	# Default: 350
	# Range: 50 ~ 1000
	sonicBoomSpeed = 350
	#How strong a sonic boom is, compared to the default (1). That's how loud it is
	#and how far away you hear it, how hard and how far away it shakes people's view, and how wide its shock
	#rings and vapour cone are. On a server, players already in the world get a change to this when they next join.
	# Default: 1.0
	# Range: 0.1 ~ 4.0
	sonicBoomStrength = 1.0
	#If true, a bearer crashing at 20 blocks a second or faster explodes where they
	#hit. A steep crash into the ground below 75 is a hero landing instead. You get a flash and a boom, everything nearby hurt and thrown back (see explosionSize), and a crater dug (see craters).
	#If false, a crash at any speed is only shielded, with a dull knock. The bearer takes whatever their ring can't pay for.
	crashExplosions = true
	#How big a crash's blast is, compared to the default (1 throws and hurts living things within
	#its crater's reach plus a quarter and two more blocks, 122 blocks at 1000 blocks a second). It sets how far
	#it throws and hurts, how big the flash and fireball are, and how far away it's seen and heard. The crater comes
	#from craterSize. A Great Foundry started wrong has its own (foundry.failureExplosionSize).
	# Default: 1.0
	# Range: 0.1 ~ 3.0
	explosionSize = 1.0
	#How hard a crash at speed hits, compared to the default (1). It sets what the bearer takes past
	#their ring's shield (and what the shield costs the ring), and what the blast does to everything nearby.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	crashDamage = 1.0
	#How wide a crash's crater is, compared to the default (1 is a small dent at 20 blocks a second, the
	#width of a village at 1000). 0 doesn't dig one.
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	craterSize = 1.0
	#If true, a bearer coming down hard does a hero landing, down on one knee with the ground shaking under
	#them (see landingShockwave). If false, every landing's a softer one, and the ring still takes the fall. On a server, players already in the world get a change to this when they next join.
	heroLandings = true

[ride]
	#How many blocks a light construct slowly bobs up and down while you ride it at a hover. Heavier ones bob less.
	#0 keeps it dead still.
	# Default: 0.05
	# Range: 0.0 ~ 0.5
	hoverBob = 0.05
	#If true, a bearer standing on a construct they made can lift it with the grip key and fly it. If
	#false, constructs can't be ridden (and one being ridden now gets set down).
	enabled = true
	#How fast a ridden construct flies, compared to the default (1 is 10 blocks a second cruising, 18
	#sprinting, 5 up or down). It applies to every gear and to climbing.
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	speed = 1.0
	#The fastest a ridden construct flies, in blocks a second, whatever speed says (200 at most. Past that a body
	#Sable moves goes too far each step to hit the ground properly). No gear goes faster, and if gearStep carries the
	#gears up to it, it's the last gear. On a server, players already in the world get a change to this when they next join.
	# Default: 100
	# Range: 10 ~ 200
	topSpeed = 100
	#The speed of a rider's first gears, in blocks a second (each from 1 to 200), slowest first. Every
	#ride starts in first gear. Double tap forward to shift up one, tap back to shift down one, and sprinting rides one
	#gear up (10 and 18, like cruising and sprinting always were). Past the last one listed they keep going up by gearStep to
	#topSpeed. On a server, players already in the world get a change to this when they next join.
	gears = [10, 18, 25, 35, 50, 75]
	#How much faster each gear past the listed gears is than the one before, in blocks a second, up to topSpeed (by
	#default: 10, 18, 25, 35, 50, 75 and 100). 0 means no gears past the listed ones. You never get more than 64 gears. On a server, players already in the world get a change to this when they next join.
	# Default: 25
	# Range: 0 ~ 200
	gearStep = 25

#The Central Power Battery. It's a frame of brass casing, glass and one light's key block round a Power Core, and the only thing that refills a
#Lantern (only on Oa, if the Lantern worlds are there). It charges the Lanterns and bearers' rings in its reach,
#keeps the Blaze Burners there lit, and turns a drive under its core. All of that runs off the charge it holds.
[centralBattery]
	#How far (blocks) a small battery reaches from its core. A medium one reaches twice as far and the
	#biggest (and the Guardians' on Oa) four times as far. That's the Lanterns it charges, the bearers whose rings it charges and
	#the Blaze Burners it keeps lit.
	# Default: 64.0
	# Range: 2.0 ~ 256.0
	radius = 64.0
	#How much charge it holds (100000 is ten Lanterns' worth at the default battery.capacity). A Power Core
	#comes full, and keeps its charge when you break it and place it again.
	# Default: 100000.0
	# Range: 1000.0 ~ 1.0E7
	capacity = 100000.0
	#How much charge it gets back by itself each second (25 is a Lantern's worth in under seven
	#minutes, and a full refill in just over an hour).
	# Default: 25.0
	# Range: 0.0 ~ 1000000.0
	regenPerSecond = 25.0
	#How much charge it gets back each second on Oa, the Guardians' world (with Create Cosmonautics).
	#250 is ten times as fast, since every Lantern gets recharged there.
	# Default: 250.0
	# Range: 0.0 ~ 1000000.0
	oaRegenPerSecond = 250.0
	#How much charge it gives each Lantern in reach each second while it's
	#recharging Lanterns (100 fills an empty Lantern in just under two minutes).
	# Default: 100.0
	# Range: 0.0 ~ 1000000.0
	lanternChargePerSecond = 100.0
	#How much charge it gives each bearer's ring in reach each second (20 fills an empty
	#ring in under a minute).
	# Default: 20.0
	# Range: 0.0 ~ 1000000.0
	ringChargePerSecond = 20.0
	#How fast (RPM) it turns the drive under its core while it's whole and has charge. 0 means it doesn't turn.
	# Default: 64
	# Range: 0 ~ 256
	rpm = 64
	#The stress (su) its drive can take at that speed. That's how much Create's machines on it can use.
	# Default: 2048.0
	# Range: 0.0 ~ 1000000.0
	stressCapacity = 2048.0
	#How much charge its drive costs each second at full load (less at a lighter load, nothing when
	#nothing's running on it). If it runs dry, the drive stops until it's back to a twentieth of its capacity.
	# Default: 8.0
	# Range: 0.0 ~ 1000000.0
	driveCostPerSecond = 8.0
	#If true, it keeps every Blaze Burner in reach lit. Kindled, or superheated where a Blaze Cake set it
	#seething, using Create's heat levels (a burner burning its own fuel gets left alone). If false, it doesn't heat any.
	heatsBurners = true
	#How much charge each burner it keeps kindled costs it each second.
	# Default: 1.0
	# Range: 0.0 ~ 1000000.0
	kindleCostPerSecond = 1.0
	#How much charge each burner it keeps superheated costs it each second.
	# Default: 4.0
	# Range: 0.0 ~ 1000000.0
	superheatCostPerSecond = 4.0

#Hard light constructs. You design, copy and summon them with the construct wheel.
[constructs]
	#If true, rings make constructs of hard light. If false, none can be designed, copied or summoned, and
	#any that are out now disappear.
	enabled = true
	#How many blocks one construct can hold for a new bearer.
	# Default: 32
	# Range: 1 ~ 16384
	baseParts = 32
	#How many more blocks it can hold for each point of the bearer's emotional strength (0 to 100). 32
	#plus 10 a point makes 1032 for a master, before what time with the ring adds (ring.blockGrowthMax).
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	partsPerWill = 10.0
	#The most blocks any construct can hold, however strong its bearer is (16384 is the most a design can record). A bigger construct takes longer to form and costs more to save, send and move.
	# Default: 4096
	# Range: 1 ~ 16384
	mostParts = 4096
	#The widest a construct can be along any axis, in blocks (64 is the most a design can record).
	# Default: 64
	# Range: 1 ~ 64
	maxSpan = 64
	#How many constructs a new bearer can keep out at once.
	# Default: 1
	# Range: 1 ~ 64
	baseOut = 1
	#How many points of emotional strength a bearer needs for each extra construct they can keep out at once (40 means one more
	#at 40, two more at 80). 0 gives no extras.
	# Default: 40.0
	# Range: 0.0 ~ 100.0
	willPerMoreOut = 40.0
	#What a construct costs to form, compared to the default (1 is half an energy for each block,
	#before a stronger bearer pays less).
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	formCost = 1.0
	#What a construct costs to keep out, compared to the default (1 is 0.005 a second for each
	#block).
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	upkeepCost = 1.0
	#How many pages of constructs a bearer gets. Each page is a wheel of slotsPerPage. Constructs on pages
	#past these are kept, but you can't reach them until the world has those pages again.
	# Default: 4
	# Range: 1 ~ 16
	pages = 4
	#How many constructs fit on a page (the slices of the wheel). Change it and a bearer's constructs keep their
	#order, page by page, starting from the first page.
	# Default: 8
	# Range: 2 ~ 12
	slotsPerPage = 8

#What hard light can be made of, and what it does.
[hardLight]
	#Blocks hard light can never form, on top of the ones the mod already keeps out (unbreakable blocks,
	#spawners, operator blocks and the tag createlanterns:not_in_constructs). Each entry's an id (create:mechanical_drill), a
	#tag (#minecraft:beds), or every block of a mod (aeronautics:*).
	forbiddenBlocks = []
	#If true, engines, blaze burners and boilers on a construct run off the bearer's ring instead of fuel,
	#and its water wheels turn without water. The ring pays machineFuelCost a second for each one. If false, they only burn
	#what's put in them, and wheels only turn in water.
	ringFuelsMachines = true
	#Energy a second for each engine, burner, boiler or water wheel the ring keeps going. A stronger bearer pays
	#less.
	# Default: 0.2
	# Range: 0.0 ~ 1000.0
	machineFuelCost = 0.2
	#If true, a construct's fires (campfires, magma, fire, lava, hot-air burners) set fire to whatever
	#touches them, burning in the light of the ring that made it. If false, they just burn what's in them.
	fireSetsAlight = true
	#How much damage a second a construct's fire does to whatever it set alight.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	fireDamage = 1.0
	#If true, an empty slot of the wheel copies a dropped item the bearer looks at. Summoned, the copy
	#comes into their hotbar in the ring's light. If false, items can't be copied, and copies that are out now disappear.
	copyItems = true
	#Energy for each point of wear a copied item takes. A copy never wears out. The ring pays this instead.
	#If the ring can't pay, the copy fades.
	# Default: 0.05
	# Range: 0.0 ~ 1000.0
	itemWearCost = 0.05
	#Items hard light can never copy, on top of the ones the mod already keeps out (rings, and anything that is
	#already hard light). Each entry's an id (minecraft:elytra), a tag (#minecraft:swords), or every item of a mod (create:*).
	forbiddenItems = []

#The ring's grip. Grabbing things with its light, then holding, hurling and pinning them.
[grip]
	#If true, a ring can grab things with its light: contraptions, constructs, living things and
	#loose stuff. If false, it can't hold anything (so it can't fly a construct its bearer rides), and drops whatever it's holding now.
	enabled = true
	#How far away the ring can grab something, compared to the default (1 is 24 blocks for a
	#new bearer, 64 for a master). On a server, players already in the world get a change to this when they next join.
	# Default: 1.0
	# Range: 0.1 ~ 10.0
	reach = 1.0
	#How much the ring lifts easily, compared to the default (1 is liftUntried for a new
	#bearer, liftMaster for a master). Anything heavier lags and sags, and the ring can't grab anything over two and a
	#half times this at all. A construct its bearer's riding can weigh twice this.
	# Default: 1.0
	# Range: 0.1 ~ 100.0
	strength = 1.0
	#The mass the ring lifts easily for a new bearer (emotional strength 0), before
	#strength. A stone block weighs 2 and a planks block weighs a half.
	# Default: 10.0
	# Range: 0.1 ~ 1.0E7
	liftUntried = 10.0
	#The mass it lifts easily for a master (100), before strength. In between it grows by the same
	#share for each point of the bearer's emotional strength. By default that's a thousand times overall, roughly double
	#every ten points.
	# Default: 10000.0
	# Range: 0.1 ~ 1.0E7
	liftMaster = 10000.0
	#How fast the ring hurls what it lifts easily, compared to the default (1 is 16 blocks a
	#second for a new bearer, 36 for a master). Heavier things fly slower.
	# Default: 1.0
	# Range: 0.1 ~ 10.0
	hurlSpeed = 1.0
	#What grabbing, holding, hurling and pinning things cost in energy, compared to the default (1).
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	cost = 1.0
	#How hard things the ring moves hit whatever they slam into, compared to the default (1).
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	impactDamage = 1.0
	#If true, the ring can pin what it's holding in place in mid-air. If false, it can't pin anything (and
	#drops whatever it's pinning now).
	pinning = true
	#If true, the ring can catch arrows, fireballs and other projectiles in the air. If
	#false, it can't catch any (and drops any it's holding or pinning now).
	catchProjectiles = true
	#Entity types no ring can grab (a ring drops one it's holding or pinning now), on top of the tag
	#createlanterns:ring_cannot_hold (the ender dragon and the wither). Each entry's an id (minecraft:warden), a tag
	#(#minecraft:raiders), or every one from a mod (alexsmobs:*).
	blockedEntities = []

	#What a ring can do with hostile mobs. That's monsters, slimes, ghasts and every other mob the game counts as
	#an enemy, by type, whatever mood it's in (an enderman's hostile, a wolf's passive). Each one only applies where the switches
	#above allow it at all.
	[grip.hostileMobs]
		#If true, a ring can grab hostile mobs, and whatever's carrying one (a boat, a cart). If false,
		#it can't, and sets down any it's holding or pinning now where they are.
		hold = true
		#If true, a ring can hurl hostile mobs it's holding, and they keep flying when it lets go. If false,
		#it can't. One it's holding stays held, and when it lets go it gets set down where it is.
		hurl = true
		#If true, a ring can pin hostile mobs in mid-air (if pinning's on at all). If false, it can't,
		#and drops any it's pinning now.
		pin = true

	#What a ring can do with passive mobs. That's animals, villagers, golems, fish and every other mob that
	#isn't hostile. Each one only applies where the switches above allow it at all.
	[grip.passiveMobs]
		#If true, a ring can grab passive mobs, and whatever's carrying one (a boat, a cart). If false,
		#it can't, and sets down any it's holding or pinning now where they are.
		hold = true
		#If true, a ring can hurl passive mobs it's holding, and they keep flying when it lets go. If false,
