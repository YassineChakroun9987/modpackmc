		#If true, a ring can pin passive mobs in mid-air (if pinning's on at all). If false, it can't,
		#and drops any it's pinning now.
		pin = true

	#What a ring can do with other players. Only ever where the server lets players hurt each other and
	#pvp.grip lets a ring grab them. Each one only applies where the switches above allow it at all.
	[grip.players]
		#If true, a ring can grab other players, and whatever's carrying one (a boat, a cart). If false,
		#it can't, and sets down any it's holding or pinning now where they are.
		hold = true
		#If true, a ring can hurl other players it's holding, and they keep flying when it lets go. If false,
		#it can't. One it's holding stays held, and when it lets go it gets set down where it is.
		hurl = true
		#If true, a ring can pin other players in mid-air (if pinning's on at all). If false, it can't,
		#and drops any it's pinning now.
		pin = true

#The suit a ring makes on its bearer. It soaks up a share of every hit, and the ring pays for it.
[suit]
	#If true, a ring makes its suit on its bearer when they ask for it. If false, it won't (and one on now disappears).
	enabled = true
	#The share of each hit the suit takes for a new bearer.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	protectionUntried = 0.5
	#The share of each hit it takes for a master (in between, it scales with their emotional strength).
	# Default: 0.8
	# Range: 0.0 ~ 1.0
	protectionMaster = 0.8
	#Energy to form the suit. A stronger bearer pays less.
	# Default: 12.0
	# Range: 0.0 ~ 100000.0
	formCost = 12.0
	#Energy a second to keep the suit on.
	# Default: 0.15
	# Range: 0.0 ~ 100000.0
	upkeepPerSecond = 0.15
	#Energy for each point of damage the suit takes instead of its bearer.
	# Default: 2.5
	# Range: 0.0 ~ 100000.0
	costPerDamage = 2.5
	#How much it steadies its bearer against knockback from hits and blasts (0 none,
	#1 all). It kicks in when a suit forms.
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	steadiness = 0.6

#How a hit knocks back a ring's bearer. It doesn't unless the hit does more than the threshold. Then it's away from
#where it came from, harder the bigger the hit.
[knockback]
	#Who gets this knockback instead of the normal kind. BEARERS (players wearing a ring, on either hand), EVERYONE
	#(every player, ring or not) or NO_ONE (vanilla knockback for all). Other living things always get vanilla knockback.
	#Allowed Values: BEARERS, EVERYONE, NO_ONE
	scope = "BEARERS"
	#How much damage a hit has to do, more than this (10 is five hearts), to knock
	#them back at all. It's counted after armour, enchantments and effects, before the suit's share. Damage with no direction
	#(a fall, fire, poison, hunger, the void, magic, drowning) doesn't knock anyone back.
	# Default: 10.0
	# Range: 0.0 ~ 10000.0
	threshold = 10.0
	#How hard a hit past the threshold throws them, compared to the default (1 is 9 blocks a
	#second just past it, one and a half times that at 5 past it, about two and a half times at 20 past it).
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	strength = 1.0
	#The fastest any hit throws them, in blocks a second.
	# Default: 40.0
	# Range: 0.0 ~ 1000.0
	topSpeed = 40.0

